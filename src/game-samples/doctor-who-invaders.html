
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Who: Space Invaders</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
  }
  #game {
    display: block;
    border: 2px solid #003B6F;
    box-shadow: 0 0 40px #003B6F, 0 0 80px #001a3a;
    cursor: none;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    pointer-events: none;
  }
  #build-footer {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(128, 188, 255, 0.75);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 170, 255, 0.35);
    pointer-events: none;
    user-select: none;
    z-index: 5;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="build-footer">Made at Microsoft Build 2026</div>
<script>
'use strict';

// ─── CANVAS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;

// Scale canvas to fit window while preserving aspect ratio
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── COLOURS ────────────────────────────────────────────────────────────────
const C = {
  bg:         '#000510',
  tardisBlue: '#003B6F',
  tardisLight:'#0055a0',
  tardisGlow: '#00aaff',
  cyan:       '#00BFFF',
  cyanGlow:   '#80dfff',
  dalek:      '#C5A028',
  dalekDark:  '#8a6e1a',
  cyberman:   '#aaaaaa',
  master:     '#8B0000',
  masterBright:'#cc2200',
  red:        '#FF3333',
  gold:       '#FFD700',
  white:      '#FFFFFF',
  grey:       '#888888',
  shieldGreen:'#00ff88',
};

// ─── AUDIO ──────────────────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, type, duration, vol=0.3, startFreq=null) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type;
  if (startFreq) {
    o.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq, audioCtx.currentTime + duration);
  } else {
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  }
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  o.start();
  o.stop(audioCtx.currentTime + duration);
}

function sfxShoot()       { playTone(800, 'square', 0.08, 0.2, 1200); }
function sfxExplode()     { playTone(80,  'sawtooth', 0.4, 0.4, 300); }
function sfxPlayerDie()   { playTone(200, 'sawtooth', 0.8, 0.5, 800); }
function sfxMystery()     { playTone(440, 'sine', 0.12, 0.15); }
function sfxWaveClear()   {
  [523,659,784,1047].forEach((f,i) => {
    setTimeout(() => playTone(f, 'sine', 0.2, 0.3), i*120);
  });
}
function sfxBonusLife()   {
  [784,988,1175].forEach((f,i) => {
    setTimeout(() => playTone(f, 'sine', 0.15, 0.3), i*100);
  });
}
function sfxEnemyShoot()  { playTone(300, 'sawtooth', 0.12, 0.15, 500); }

// Invader march beat state
let marchBeat = 0;
const marchFreqs = [110, 98, 87, 78];
function sfxMarch() {
  playTone(marchFreqs[marchBeat % 4], 'square', 0.1, 0.25);
  marchBeat++;
}

// ─── STARS ──────────────────────────────────────────────────────────────────
const STAR_COUNT = 200;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 0.3 + 0.05,
  twinkle: Math.random() * Math.PI * 2,
  twinkleSpeed: Math.random() * 0.05 + 0.01,
}));

function updateStars() {
  stars.forEach(s => {
    s.y += s.speed;
    s.twinkle += s.twinkleSpeed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });
}

function drawStars() {
  stars.forEach(s => {
    const alpha = 0.5 + 0.5 * Math.sin(s.twinkle);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ─── SPRITE DRAWING ─────────────────────────────────────────────────────────

// TARDIS — player ship (police box shape, top-down view)
function drawTARDIS(x, y, w, h, glowing=false) {
  const cx = x + w/2;
  ctx.save();

  if (glowing) {
    ctx.shadowColor = C.tardisGlow;
    ctx.shadowBlur  = 18;
  }

  // Main box body
  ctx.fillStyle = C.tardisBlue;
  ctx.fillRect(x, y + h*0.2, w, h*0.75);

  // Roof
  ctx.fillStyle = C.tardisLight;
  ctx.beginPath();
  ctx.moveTo(cx, y);
  ctx.lineTo(x + w*0.1, y + h*0.22);
  ctx.lineTo(x + w*0.9, y + h*0.22);
  ctx.closePath();
  ctx.fill();

  // Lamp on top
  ctx.fillStyle = C.cyan;
  ctx.beginPath();
  ctx.arc(cx, y + h*0.06, w*0.1, 0, Math.PI*2);
  ctx.fill();

  // Windows (4 panes)
  ctx.fillStyle = C.tardisGlow;
  const wp = w*0.18, hp2 = h*0.18;
  ctx.fillRect(x + w*0.12, y + h*0.28, wp, hp2);
  ctx.fillRect(x + w*0.38, y + h*0.28, wp, hp2);
  ctx.fillRect(x + w*0.62, y + h*0.28, wp, hp2);

  // "POLICE BOX" sign
  ctx.fillStyle = C.white;
  ctx.fillRect(x + w*0.08, y + h*0.52, w*0.84, h*0.09);
  ctx.fillStyle = C.tardisBlue;
  ctx.font = `bold ${Math.round(h*0.08)}px Orbitron, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('TARDIS', cx, y + h*0.60);

  // Door panel lines
  ctx.strokeStyle = C.tardisLight;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + w*0.08, y + h*0.62, w*0.84, h*0.3);
  ctx.beginPath();
  ctx.moveTo(cx, y + h*0.62);
  ctx.lineTo(cx, y + h*0.92);
  ctx.stroke();

  ctx.restore();
}

// Dalek — classic pepperpot shape
function drawDalek(x, y, w, h, frame=0) {
  const cx = x + w/2;
  ctx.save();

  // Skirt (lower body) — dome bumps
  ctx.fillStyle = C.dalekDark;
  ctx.fillRect(x, y + h*0.5, w, h*0.5);

  // Bump dots on skirt
  ctx.fillStyle = C.dalek;
  const bumpR = w * 0.1;
  const bumpsX = [0.2, 0.5, 0.8];
  const bumpsY = [0.62, 0.78, 0.92];
  bumpsX.forEach(bx => bumpsY.forEach(by => {
    ctx.beginPath();
    ctx.arc(x + w*bx, y + h*by, bumpR, 0, Math.PI*2);
    ctx.fill();
  }));

  // Mid section
  ctx.fillStyle = C.dalek;
  ctx.fillRect(x + w*0.1, y + h*0.32, w*0.8, h*0.22);

  // Head dome
  ctx.fillStyle = C.dalek;
  ctx.beginPath();
  ctx.arc(cx, y + h*0.25, w*0.38, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x + w*0.12, y + h*0.22, w*0.76, h*0.08);

  // Eye stalk
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, y + h*0.18);
  ctx.lineTo(cx + w*0.4, y + h*0.08);
  ctx.stroke();
  ctx.fillStyle = C.cyan;
  ctx.beginPath();
  ctx.arc(cx + w*0.4, y + h*0.08, w*0.1, 0, Math.PI*2);
  ctx.fill();

  // Plunger arm
  ctx.strokeStyle = C.dalekDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + w*0.2, y + h*0.38);
  ctx.lineTo(x - w*0.1, y + h*0.45);
  ctx.stroke();
  ctx.fillStyle = C.gold;
  ctx.beginPath();
  ctx.arc(x - w*0.1, y + h*0.45, w*0.1, 0, Math.PI*2);
  ctx.fill();

  // Gun arm
  ctx.strokeStyle = C.dalekDark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + w*0.8, y + h*0.38);
  ctx.lineTo(x + w*1.1, y + h*0.35);
  ctx.stroke();
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + w*0.9, y + h*0.36);
  ctx.lineTo(x + w*1.12, y + h*0.33);
  ctx.stroke();

  // Animate — slight vertical bob
  if (frame % 2 === 1) {
    ctx.fillStyle = 'rgba(197,160,40,0.15)';
    ctx.fillRect(x, y, w, h);
  }

  ctx.restore();
}

// Cyberman — humanoid robot face
function drawCyberman(x, y, w, h, frame=0) {
  const cx = x + w/2;
  ctx.save();

  // Head
  ctx.fillStyle = C.cyberman;
  ctx.beginPath();
  ctx.roundRect(x + w*0.1, y + h*0.05, w*0.8, h*0.55, [w*0.15]);
  ctx.fill();

  // Face plate — darker
  ctx.fillStyle = '#666';
  ctx.fillRect(x + w*0.2, y + h*0.2, w*0.6, h*0.3);

  // Eyes (two horizontal slits, glow blue)
  ctx.fillStyle = C.tardisGlow;
  if (frame % 2 === 0) ctx.fillStyle = C.cyan;
  ctx.fillRect(x + w*0.22, y + h*0.26, w*0.22, h*0.08);
  ctx.fillRect(x + w*0.56, y + h*0.26, w*0.22, h*0.08);

  // Ear handles
  ctx.fillStyle = '#888';
  ctx.fillRect(x,        y + h*0.15, w*0.12, h*0.25);
  ctx.fillRect(x + w*0.88, y + h*0.15, w*0.12, h*0.25);

  // Mouth grille
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  for (let i=0; i<4; i++) {
    ctx.beginPath();
    ctx.moveTo(x + w*0.25, y + h*(0.38 + i*0.04));
    ctx.lineTo(x + w*0.75, y + h*(0.38 + i*0.04));
    ctx.stroke();
  }

  // Neck/body stub
  ctx.fillStyle = '#999';
  ctx.fillRect(x + w*0.3, y + h*0.6, w*0.4, h*0.35);
  ctx.fillRect(x + w*0.15, y + h*0.72, w*0.7, h*0.25);

  // Chest circle
  ctx.fillStyle = C.tardisGlow;
  ctx.beginPath();
  ctx.arc(cx, y + h*0.78, w*0.12, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// The Master — menacing dark figure with laser
function drawMaster(x, y, w, h, frame=0) {
  const cx = x + w/2;
  ctx.save();

  // Cape/body
  ctx.fillStyle = '#1a0000';
  ctx.beginPath();
  ctx.moveTo(x + w*0.1, y + h);
  ctx.lineTo(x,         y + h*0.4);
  ctx.lineTo(cx,        y + h*0.05);
  ctx.lineTo(x + w,     y + h*0.4);
  ctx.lineTo(x + w*0.9, y + h);
  ctx.closePath();
  ctx.fill();

  // Body highlight
  ctx.fillStyle = C.master;
  ctx.beginPath();
  ctx.moveTo(x + w*0.25, y + h);
  ctx.lineTo(x + w*0.15, y + h*0.45);
  ctx.lineTo(cx,         y + h*0.12);
  ctx.lineTo(x + w*0.85, y + h*0.45);
  ctx.lineTo(x + w*0.75, y + h);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.fillStyle = '#cc8866';
  ctx.beginPath();
  ctx.arc(cx, y + h*0.22, w*0.22, 0, Math.PI*2);
  ctx.fill();

  // Beard/goatee (The Master's trademark)
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.moveTo(cx - w*0.08, y + h*0.32);
  ctx.lineTo(cx,          y + h*0.42);
  ctx.lineTo(cx + w*0.08, y + h*0.32);
  ctx.closePath();
  ctx.fill();

  // Eyes — glowing red
  const eyeGlow = frame % 2 === 0 ? C.red : C.masterBright;
  ctx.fillStyle = eyeGlow;
  ctx.beginPath();
  ctx.arc(cx - w*0.09, y + h*0.20, w*0.05, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + w*0.09, y + h*0.20, w*0.05, 0, Math.PI*2);
  ctx.fill();

  // Drumming fingers (4 dots)
  ctx.fillStyle = C.master;
  [0.1, 0.25, 0.4, 0.55].forEach((t, i) => {
    const bob = frame%2===0 && i===Math.floor(Date.now()/200)%4;
    ctx.beginPath();
    ctx.arc(x + w*(0.6 + i*0.12), y + h*(0.65 + (bob ? -0.05:0)), w*0.06, 0, Math.PI*2);
    ctx.fill();
  });

  ctx.restore();
}

// Mystery TARDIS (bonus ship — miniaturised, flying)
function drawMysteryTARDIS(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = C.tardisGlow;
  ctx.shadowBlur = 20;
  ctx.fillStyle = C.tardisLight;
  ctx.fillRect(x, y + h*0.2, w, h*0.7);
  ctx.fillStyle = C.tardisBlue;
  ctx.beginPath();
  ctx.moveTo(x + w/2, y);
  ctx.lineTo(x, y + h*0.22);
  ctx.lineTo(x+w, y + h*0.22);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = C.cyan;
  ctx.beginPath();
  ctx.arc(x + w/2, y + h*0.1, w*0.1, 0, Math.PI*2);
  ctx.fill();
  // Windows
  ctx.fillStyle = C.tardisGlow;
  ctx.fillRect(x+w*0.15, y+h*0.3, w*0.25, h*0.2);
  ctx.fillRect(x+w*0.6,  y+h*0.3, w*0.25, h*0.2);
  ctx.restore();
}

// Shield block
function drawShield(shield) {
  shield.blocks.forEach(b => {
    if (!b.alive) return;
    const alpha = b.hp / 3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.shieldGreen;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.globalAlpha = 1;
  });
}

// Explosion particle
function drawExplosion(exp) {
  const progress = exp.age / exp.maxAge;
  const alpha = 1 - progress;
  ctx.save();
  ctx.globalAlpha = alpha;
  exp.particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(
      exp.x + p.vx * exp.age,
      exp.y + p.vy * exp.age,
      p.r * (1 - progress * 0.5),
      0, Math.PI*2
    );
    ctx.fill();
  });
  ctx.restore();
}

// ─── SHIELD BUILDER ─────────────────────────────────────────────────────────
function buildShield(cx, y) {
  const bw = 8, bh = 6;
  const cols = 10, rows = 5;
  const sw = cols * bw, sh = rows * bh;
  const sx = cx - sw/2;
  const blocks = [];
  // Arch shape — remove bottom-center notch and top corners
  for (let r=0; r<rows; r++) {
    for (let c=0; c<cols; c++) {
      // Top corner cutouts
      if (r === 0 && (c < 2 || c >= cols-2)) continue;
      // Bottom notch (entrance)
      if (r >= rows-2 && c >= 3 && c < cols-3) continue;
      blocks.push({ x: sx+c*bw, y: y+r*bh, w: bw, h: bh, hp: 3, alive: true });
    }
  }
  return { cx, y, blocks };
}

// ─── GAME STATE ─────────────────────────────────────────────────────────────
const STATES = { TITLE:0, PLAYING:1, GAME_OVER:2, WIN:3, BETWEEN_WAVES:4 };
let state = STATES.TITLE;

let score = 0;
let highScore = parseInt(localStorage.getItem('dw_si_hs') || '0');
let lives = 3;
let wave = 1;
let bonusLifeGiven = false;

// Player
let player = {};
function resetPlayer() {
  player = { x: W/2 - 20, y: H - 60, w: 40, h: 50, vx: 0, speed: 4, glowing: false };
}

// Bullets
let playerBullets = [];
let enemyBullets  = [];
const PB_SPEED = 7;
const EB_SPEED = 3.5;

// Invaders
const INV_COLS = 11, INV_ROWS = 5;
const INV_W = 36, INV_H = 28, INV_PAD_X = 14, INV_PAD_Y = 12;
let invaders = [];
let invDir = 1; // 1 = right, -1 = left
let invDropNeeded = false;
let invMarchTimer = 0;
let invMarchInterval = 60; // frames between march steps
let invDead = 0;

function buildInvaders() {
  invaders = [];
  invDir = 1;
  invDropNeeded = false;
  invMarchTimer = 0;
  invDead = 0;
  for (let r=0; r<INV_ROWS; r++) {
    for (let c=0; c<INV_COLS; c++) {
      // Row 0 = Master (top), rows 1-2 = Cyberman, rows 3-4 = Dalek
      const type = r === 0 ? 'master' : r <= 2 ? 'cyberman' : 'dalek';
      const pts  = type==='master' ? 30 : type==='cyberman' ? 20 : 10;
      invaders.push({
        c, r, type, pts,
        x: 60 + c*(INV_W + INV_PAD_X),
        y: 80 + r*(INV_H + INV_PAD_Y) + (wave-1)*5,  // each wave starts slightly lower
        w: INV_W, h: INV_H,
        alive: true,
        frame: 0,
        exploding: false,
      });
    }
  }
}

// Shields
let shields = [];
function buildShields() {
  shields = [];
  const positions = [W*0.15, W*0.38, W*0.62, W*0.85];
  positions.forEach(cx => shields.push(buildShield(cx, H - 140)));
}

// Mystery ship
let mystery = null;
let mysteryTimer = 0;
const MYSTERY_INTERVAL = 1500; // frames

// Explosions
let explosions = [];
function spawnExplosion(x, y, colors) {
  const particles = Array.from({length: 12}, () => ({
    vx: (Math.random()-0.5)*3,
    vy: (Math.random()-0.5)*3,
    r: Math.random()*4+2,
    color: colors[Math.floor(Math.random()*colors.length)],
  }));
  explosions.push({ x, y, particles, age: 0, maxAge: 30 });
}

// Screen flash
let flashTimer = 0, flashColor = 'white';
function flash(color='white', duration=20) { flashColor=color; flashTimer=duration; }

// ─── INPUT ──────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();

  if (state === STATES.TITLE && (e.code==='Space'||e.code==='Enter')) startGame();
  if (state === STATES.GAME_OVER && (e.code==='Space'||e.code==='Enter')) { state=STATES.TITLE; }
  if (state === STATES.WIN && (e.code==='Space'||e.code==='Enter')) { state=STATES.TITLE; }
  if (state === STATES.BETWEEN_WAVES && (e.code==='Space'||e.code==='Enter')) startWave();
  if (state === STATES.PLAYING && e.code==='Space') firePlayerBullet();
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch / click support
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state === STATES.TITLE) startGame();
  else if (state === STATES.GAME_OVER || state === STATES.WIN) state = STATES.TITLE;
  else if (state === STATES.BETWEEN_WAVES) startWave();
  else if (state === STATES.PLAYING) firePlayerBullet();
});

// ─── GAME MANAGEMENT ────────────────────────────────────────────────────────
function startGame() {
  score = 0;
  lives = 3;
  wave  = 1;
  bonusLifeGiven = false;
  playerBullets = [];
  enemyBullets  = [];
  explosions    = [];
  mystery       = null;
  mysteryTimer  = 0;
  resetPlayer();
  buildInvaders();
  buildShields();
  state = STATES.PLAYING;
}

function startWave() {
  wave++;
  playerBullets = [];
  enemyBullets  = [];
  explosions    = [];
  mystery       = null;
  mysteryTimer  = 0;
  resetPlayer();
  buildInvaders();
  // Don't rebuild shields — carry over damage
  state = STATES.PLAYING;
}

function firePlayerBullet() {
  if (playerBullets.length >= 2) return;
  playerBullets.push({ x: player.x + player.w/2 - 2, y: player.y, w:4, h:12 });
  sfxShoot();
}

function aliveInvaders() { return invaders.filter(i => i.alive); }

function marchSpeed() {
  const total = INV_COLS * INV_ROWS;
  const alive = aliveInvaders().length;
  const ratio = alive / total;
  return Math.max(6, Math.round(60 * ratio / wave));
}

// ─── UPDATE ──────────────────────────────────────────────────────────────────
let frameCount = 0;
let playerDeadTimer = 0;
let playerVisible = true;

function update() {
  frameCount++;
  if (flashTimer > 0) flashTimer--;

  updateStars();

  if (state !== STATES.PLAYING) return;

  // Player movement
  const spd = player.speed + wave * 0.2;
  if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0)
    player.x -= spd;
  if ((keys['ArrowRight'] || keys['KeyD']) && player.x + player.w < W)
    player.x += spd;

  // Glowing when firing
  player.glowing = playerBullets.length > 0;

  // Invader march
  invMarchTimer++;
  const mSpeed = marchSpeed();
  if (invMarchTimer >= mSpeed) {
    invMarchTimer = 0;
    sfxMarch();
    invaders.forEach(i => { if(i.alive) i.frame = (i.frame+1)%2; });

    // Find left/right edge
    const alive = aliveInvaders();
    if (!alive.length) return;
    const rightmost = Math.max(...alive.map(i => i.x + i.w));
    const leftmost  = Math.min(...alive.map(i => i.x));

    if (invDropNeeded) {
      invaders.forEach(i => { if(i.alive) i.y += 18; });
      invDir *= -1;
      invDropNeeded = false;
    } else {
      const step = 6;
      invaders.forEach(i => { if(i.alive) i.x += invDir * step; });
      if (rightmost + invDir*step > W - 20 || leftmost + invDir*step < 20)
        invDropNeeded = true;
    }

    // Check invader reach bottom
    const bottom = Math.max(...alive.map(i => i.y + i.h));
    if (bottom >= player.y) killPlayer();
  }

  // Enemy shooting
  if (frameCount % Math.max(30, 90 - wave*8) === 0) {
    const alive = aliveInvaders();
    if (alive.length) {
      // Pick random invader from bottom of each column
      const cols = {};
      alive.forEach(i => {
        if (!cols[i.c] || cols[i.c].y < i.y) cols[i.c] = i;
      });
      const shooters = Object.values(cols);
      const shooter  = shooters[Math.floor(Math.random()*shooters.length)];
      enemyBullets.push({ x: shooter.x + shooter.w/2 - 2, y: shooter.y+shooter.h, w:4, h:12, color: C.red });
      sfxEnemyShoot();
    }
  }

  // Mystery ship spawn
  mysteryTimer++;
  if (!mystery && mysteryTimer >= MYSTERY_INTERVAL) {
    mysteryTimer = 0;
    const goRight = Math.random() > 0.5;
    mystery = { x: goRight ? -40 : W+10, y: 30, w: 40, h: 28, vx: goRight ? 2.5 : -2.5, pts: [100,150,200,300][Math.floor(Math.random()*4)] };
  }
  if (mystery) {
    mystery.x += mystery.vx;
    if (frameCount % 15 === 0) sfxMystery();
    if (mystery.x > W + 60 || mystery.x < -60) mystery = null;
  }

  // Move player bullets
  playerBullets = playerBullets.filter(b => {
    b.y -= PB_SPEED;
    return b.y + b.h > 0;
  });

  // Move enemy bullets
  enemyBullets = enemyBullets.filter(b => {
    b.y += EB_SPEED + wave*0.3;
    return b.y < H;
  });

  // ─ Collision: player bullet vs invaders
  playerBullets.forEach((b, bi) => {
    invaders.forEach(inv => {
      if (!inv.alive) return;
      if (b.x < inv.x+inv.w && b.x+b.w > inv.x && b.y < inv.y+inv.h && b.y+b.h > inv.y) {
        inv.alive = false;
        invDead++;
        score += inv.pts * wave;
        playerBullets.splice(bi, 1);
        const colors = inv.type==='master' ? [C.red,C.masterBright,C.gold] :
                       inv.type==='cyberman' ? [C.cyberman,'#ccc',C.tardisGlow] :
                       [C.dalek, C.gold, '#ff0'];
        spawnExplosion(inv.x+inv.w/2, inv.y+inv.h/2, colors);
        sfxExplode();

        if (!bonusLifeGiven && score >= 1000) {
          lives++;
          bonusLifeGiven = true;
          flash(C.tardisGlow, 25);
          sfxBonusLife();
        }
      }
    });
  });

  // ─ Collision: player bullet vs mystery
  if (mystery) {
    playerBullets.forEach((b, bi) => {
      if (b.x < mystery.x+mystery.w && b.x+b.w > mystery.x && b.y < mystery.y+mystery.h && b.y+b.h > mystery.y) {
        score += mystery.pts * wave;
        spawnExplosion(mystery.x+mystery.w/2, mystery.y+mystery.h/2, [C.tardisGlow, C.cyan, C.white]);
        sfxExplode();
        mystery = null;
        playerBullets.splice(bi, 1);
      }
    });
  }

  // ─ Collision: enemy bullet vs player
  if (playerVisible) {
    enemyBullets.forEach((b, bi) => {
      if (b.x < player.x+player.w && b.x+b.w > player.x && b.y < player.y+player.h && b.y+b.h > player.y) {
        enemyBullets.splice(bi, 1);
        killPlayer();
      }
    });
  }

  // ─ Collision: bullets vs shields
  const allBullets = [...playerBullets, ...enemyBullets];
  allBullets.forEach(b => {
    shields.forEach(sh => {
      sh.blocks.forEach(bl => {
        if (!bl.alive) return;
        if (b.x < bl.x+bl.w && b.x+b.w > bl.x && b.y < bl.y+bl.h && b.y+b.h > bl.y) {
          bl.hp--;
          if (bl.hp <= 0) bl.alive = false;
          // remove bullet from its array
          const pi = playerBullets.indexOf(b);
          if (pi !== -1) playerBullets.splice(pi, 1);
          const ei = enemyBullets.indexOf(b);
          if (ei !== -1) enemyBullets.splice(ei, 1);
        }
      });
    });
  });

  // Player death animation
  if (playerDeadTimer > 0) {
    playerDeadTimer--;
    playerVisible = Math.floor(playerDeadTimer / 5) % 2 === 0;
    if (playerDeadTimer === 0) {
      if (lives <= 0) {
        if (score > highScore) { highScore = score; localStorage.setItem('dw_si_hs', highScore); }
        state = STATES.GAME_OVER;
      } else {
        playerVisible = true;
      }
    }
  }

  // Update explosions
  explosions.forEach(e => e.age++);
  explosions = explosions.filter(e => e.age < e.maxAge);

  // Wave clear check
  if (aliveInvaders().length === 0) {
    sfxWaveClear();
    if (score > highScore) { highScore = score; localStorage.setItem('dw_si_hs', highScore); }
    if (wave >= 5) {
      state = STATES.WIN;
    } else {
      state = STATES.BETWEEN_WAVES;
    }
  }
}

function killPlayer() {
  if (playerDeadTimer > 0) return;
  spawnExplosion(player.x+player.w/2, player.y+player.h/2, [C.tardisBlue, C.cyan, C.white]);
  sfxPlayerDie();
  flash(C.red, 30);
  lives--;
  playerDeadTimer = 90;
  playerVisible = false;
}

// ─── DRAW ────────────────────────────────────────────────────────────────────
function drawHUD() {
  // Score
  ctx.fillStyle = C.cyan;
  ctx.font = 'bold 16px Orbitron, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 10, 22);
  ctx.fillStyle = C.white;
  ctx.fillText(score.toString().padStart(6,'0'), 10, 42);

  // High score
  ctx.fillStyle = C.grey;
  ctx.textAlign = 'center';
  ctx.fillText('HI-SCORE', W/2, 22);
  ctx.fillStyle = C.white;
  ctx.fillText(highScore.toString().padStart(6,'0'), W/2, 42);

  // Wave
  ctx.fillStyle = C.dalek;
  ctx.textAlign = 'right';
  ctx.fillText('WAVE ' + wave, W-10, 22);

  // Lives (TARDIS icons)
  ctx.fillStyle = C.tardisBlue;
  ctx.textAlign = 'left';
  ctx.fillText('LIVES:', W-120, 42);
  for (let i=0; i<lives; i++) {
    drawTARDIS(W - 110 + i*28, 28, 20, 26);
  }

  // Bottom line
  ctx.strokeStyle = C.tardisBlue;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H-20);
  ctx.lineTo(W, H-20);
  ctx.stroke();

  // Score legend
  const legend = [
    { label:'THE MASTER', color: C.masterBright, pts: 30*wave },
    { label:'CYBERMAN',   color: C.cyberman,     pts: 20*wave },
    { label:'DALEK',      color: C.dalek,         pts: 10*wave },
  ];
  ctx.font = '10px Orbitron, monospace';
  let lx = 10;
  legend.forEach(l => {
    ctx.fillStyle = l.color;
    ctx.textAlign = 'left';
    ctx.fillText(`${l.label} = ${l.pts}`, lx, H-6);
    lx += 190;
  });
}

const DW_QUOTES = [
  '"Allons-y!" — The Doctor',
  '"Wibbly wobbly, timey wimey." — The Doctor',
  '"I am not a good man! I am not a bad man. I\'m the Doctor." — The Doctor',
  '"Bow ties are cool." — Eleventh Doctor',
  '"Never cruel, nor cowardly." — The Doctor\'s Promise',
  '"We\'re all stories in the end." — The Doctor',
  '"Run!" — The Doctor',
];

let titleQuote = DW_QUOTES[0];

function drawTitle() {
  // Background overlay
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  // Title glow
  ctx.save();
  ctx.shadowColor = C.tardisGlow;
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = C.cyan;
  ctx.font        = 'bold 52px Orbitron, monospace';
  ctx.textAlign   = 'center';
  ctx.fillText('DOCTOR WHO', W/2, 140);
  ctx.restore();

  ctx.fillStyle = C.white;
  ctx.font      = 'bold 28px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SPACE INVADERS', W/2, 185);

  // Animated TARDIS
  const t = Date.now() / 600;
  drawTARDIS(W/2 - 30, 210 + Math.sin(t)*8, 60, 80, true);

  // Score table preview (enemies + points)
  const yBase = 320;
  ctx.font = '13px Orbitron, monospace';
  ctx.fillStyle = C.grey;
  ctx.textAlign = 'center';
  ctx.fillText('— ENEMY GUIDE —', W/2, yBase);

  [
    { draw: drawMaster,   label:'THE MASTER',  pts:'= 30 pts × WAVE', color: C.masterBright },
    { draw: drawCyberman, label:'CYBERMAN',    pts:'= 20 pts × WAVE', color: C.cyberman },
    { draw: drawDalek,    label:'DALEK',       pts:'= 10 pts × WAVE', color: C.dalek },
  ].forEach((e,i) => {
    const ey = yBase + 20 + i*52;
    e.draw(W/2 - 120, ey, 32, 28, 0);
    ctx.fillStyle = e.color;
    ctx.font = '12px Orbitron, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(e.label, W/2 - 80, ey+16);
    ctx.fillStyle = C.white;
    ctx.fillText(e.pts, W/2 - 80, ey+30);
  });

  // Quote
  ctx.fillStyle = C.grey;
  ctx.font      = 'italic 12px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(titleQuote, W/2, yBase + 200);

  // Blink start text
  if (Math.floor(Date.now()/600) % 2 === 0) {
    ctx.save();
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = C.cyan;
    ctx.font        = 'bold 18px Orbitron, monospace';
    ctx.textAlign   = 'center';
    ctx.fillText('PRESS SPACE / TAP TO START', W/2, H-50);
    ctx.restore();
  }

  // Controls hint
  ctx.fillStyle = C.grey;
  ctx.font      = '11px Orbitron, monospace';
  ctx.fillText('← → or A D to move   |   SPACE to fire', W/2, H-28);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = C.red;
  ctx.shadowBlur  = 25;
  ctx.fillStyle   = C.red;
  ctx.font        = 'bold 48px Orbitron, monospace';
  ctx.textAlign   = 'center';
  ctx.fillText('EXTERMINATE!', W/2, H/2 - 80);
  ctx.restore();

  ctx.fillStyle = C.white;
  ctx.font      = 'bold 24px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('THE DALEKS HAVE WON', W/2, H/2 - 30);

  ctx.fillStyle = C.dalek;
  ctx.font      = '18px Orbitron, monospace';
  ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 20);
  ctx.fillText(`HI-SCORE: ${highScore}`, W/2, H/2 + 50);

  const q = DW_QUOTES[Math.floor(Date.now()/5000) % DW_QUOTES.length];
  ctx.fillStyle = C.grey;
  ctx.font      = 'italic 12px Orbitron, monospace';
  ctx.fillText(q, W/2, H/2 + 90);

  if (Math.floor(Date.now()/700) % 2 === 0) {
    ctx.fillStyle = C.cyan;
    ctx.font      = 'bold 16px Orbitron, monospace';
    ctx.fillText('PRESS SPACE TO RETURN', W/2, H - 50);
  }
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,5,16,0.8)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = C.tardisGlow;
  ctx.shadowBlur  = 30;
  ctx.fillStyle   = C.cyan;
  ctx.font        = 'bold 52px Orbitron, monospace';
  ctx.textAlign   = 'center';
  ctx.fillText("ALLONS-Y!", W/2, H/2 - 80);
  ctx.restore();

  ctx.fillStyle = C.white;
  ctx.font      = 'bold 22px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('THE UNIVERSE IS SAFE!', W/2, H/2 - 30);
  ctx.fillText('FOR NOW...', W/2, H/2 + 5);

  ctx.fillStyle = C.tardisGlow;
  ctx.font      = '18px Orbitron, monospace';
  ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 50);
  ctx.fillText(`HI-SCORE: ${highScore}`, W/2, H/2 + 78);

  const t = Date.now() / 800;
  drawTARDIS(W/2 - 25, H/2 - 200 + Math.sin(t)*6, 50, 65, true);

  if (Math.floor(Date.now()/700) % 2 === 0) {
    ctx.fillStyle = C.cyan;
    ctx.font      = 'bold 16px Orbitron, monospace';
    ctx.fillText('PRESS SPACE TO PLAY AGAIN', W/2, H - 50);
  }
}

function drawBetweenWaves() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = C.tardisGlow;
  ctx.shadowBlur  = 20;
  ctx.fillStyle   = C.cyan;
  ctx.font        = 'bold 40px Orbitron, monospace';
  ctx.textAlign   = 'center';
  ctx.fillText(`WAVE ${wave} CLEARED!`, W/2, H/2 - 60);
  ctx.restore();

  ctx.fillStyle = C.white;
  ctx.font      = '20px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${score}`, W/2, H/2);
  ctx.fillText(`NEXT: WAVE ${wave+1}`, W/2, H/2 + 35);

  ctx.fillStyle = C.grey;
  ctx.font      = '13px Orbitron, monospace';
  const q = DW_QUOTES[wave % DW_QUOTES.length];
  ctx.fillText(q, W/2, H/2 + 80);

  if (Math.floor(Date.now()/700) % 2 === 0) {
    ctx.fillStyle = C.dalek;
    ctx.font      = 'bold 16px Orbitron, monospace';
    ctx.fillText('PRESS SPACE TO CONTINUE', W/2, H - 50);
  }
}

function draw() {
  // Background
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  drawStars();

  if (state === STATES.TITLE) {
    drawTitle();
  } else if (state === STATES.GAME_OVER) {
    drawGameOver();
  } else if (state === STATES.WIN) {
    drawWin();
  } else if (state === STATES.BETWEEN_WAVES) {
    drawBetweenWaves();
  } else {
    // PLAYING state

    // Shields
    shields.forEach(drawShield);

    // Invaders
    invaders.forEach(inv => {
      if (!inv.alive) return;
      if (inv.type === 'dalek')    drawDalek(inv.x, inv.y, inv.w, inv.h, inv.frame);
      else if (inv.type === 'cyberman') drawCyberman(inv.x, inv.y, inv.w, inv.h, inv.frame);
      else                         drawMaster(inv.x, inv.y, inv.w, inv.h, inv.frame);
    });

    // Mystery ship
    if (mystery) {
      drawMysteryTARDIS(mystery.x, mystery.y, mystery.w, mystery.h);
      ctx.fillStyle = C.gold;
      ctx.font = '10px Orbitron, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('?', mystery.x + mystery.w/2, mystery.y - 4);
    }

    // Player
    if (playerVisible) {
      drawTARDIS(player.x, player.y, player.w, player.h, player.glowing);
    }

    // Player bullets (cyan glow)
    playerBullets.forEach(b => {
      ctx.save();
      ctx.shadowColor = C.cyan;
      ctx.shadowBlur  = 10;
      ctx.fillStyle   = C.cyan;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.restore();
    });

    // Enemy bullets (red bolts)
    enemyBullets.forEach(b => {
      ctx.save();
      ctx.shadowColor = C.red;
      ctx.shadowBlur  = 8;
      ctx.fillStyle   = C.red;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.restore();
    });

    // Explosions
    explosions.forEach(drawExplosion);

    drawHUD();
  }

  // Screen flash overlay
  if (flashTimer > 0) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = (flashTimer / 30) * 0.35;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Randomise initial title quote
titleQuote = DW_QUOTES[Math.floor(Math.random()*DW_QUOTES.length)];

loop();
</script>
