<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Space Invaders Game Makers Community</title>
  <desc id="desc">A Microsoft Build themed community image with pixel aliens, spaceships, code blocks, and a GitHub Copilot inspired badge.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.48" stop-color="#14213f"/>
      <stop offset="1" stop-color="#0b3b43"/>
    </linearGradient>
    <linearGradient id="buildBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a4ef"/>
      <stop offset="0.32" stop-color="#7fba00"/>
      <stop offset="0.66" stop-color="#ffb900"/>
      <stop offset="1" stop-color="#f25022"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="starGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="16" r="2" fill="#d7f7ff" opacity="0.8"/>
      <circle cx="54" cy="38" r="1.6" fill="#ffffff" opacity="0.7"/>
      <circle cx="32" cy="68" r="1.2" fill="#9be7ff" opacity="0.65"/>
    </pattern>
    <g id="alienGreen">
      <rect x="20" y="0" width="20" height="20" fill="#7fba00"/>
      <rect x="60" y="0" width="20" height="20" fill="#7fba00"/>
      <rect x="0" y="20" width="100" height="20" fill="#7fba00"/>
      <rect x="0" y="40" width="20" height="20" fill="#7fba00"/>
      <rect x="40" y="40" width="20" height="20" fill="#7fba00"/>
      <rect x="80" y="40" width="20" height="20" fill="#7fba00"/>
      <rect x="0" y="60" width="100" height="20" fill="#7fba00"/>
      <rect x="20" y="80" width="20" height="20" fill="#7fba00"/>
      <rect x="60" y="80" width="20" height="20" fill="#7fba00"/>
      <rect x="24" y="28" width="14" height="14" fill="#111827"/>
      <rect x="62" y="28" width="14" height="14" fill="#111827"/>
    </g>
    <g id="alienBlue">
      <rect x="20" y="0" width="20" height="20" fill="#00a4ef"/>
      <rect x="60" y="0" width="20" height="20" fill="#00a4ef"/>
      <rect x="0" y="20" width="100" height="20" fill="#00a4ef"/>
      <rect x="20" y="40" width="60" height="20" fill="#00a4ef"/>
      <rect x="0" y="60" width="20" height="20" fill="#00a4ef"/>
      <rect x="80" y="60" width="20" height="20" fill="#00a4ef"/>
      <rect x="20" y="80" width="20" height="20" fill="#00a4ef"/>
      <rect x="60" y="80" width="20" height="20" fill="#00a4ef"/>
      <rect x="25" y="28" width="12" height="12" fill="#111827"/>
      <rect x="63" y="28" width="12" height="12" fill="#111827"/>
    </g>
    <g id="alienOrange">
      <rect x="20" y="0" width="20" height="20" fill="#ffb900"/>
      <rect x="60" y="0" width="20" height="20" fill="#ffb900"/>
      <rect x="0" y="20" width="100" height="20" fill="#ffb900"/>
      <rect x="0" y="40" width="100" height="20" fill="#ffb900"/>
      <rect x="20" y="60" width="20" height="20" fill="#ffb900"/>
      <rect x="60" y="60" width="20" height="20" fill="#ffb900"/>
      <rect x="0" y="80" width="20" height="20" fill="#ffb900"/>
      <rect x="80" y="80" width="20" height="20" fill="#ffb900"/>
      <rect x="25" y="30" width="12" height="12" fill="#111827"/>
      <rect x="63" y="30" width="12" height="12" fill="#111827"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#starGrid)" opacity="0.78"/>
  <path d="M0 704 C240 638 389 771 610 702 C824 635 997 651 1213 704 C1390 747 1497 707 1600 664 L1600 900 L0 900 Z" fill="#061a24" opacity="0.9"/>
  <rect x="0" y="822" width="1600" height="18" fill="url(#buildBand)" opacity="0.95"/>

  <g opacity="0.5">
    <rect x="132" y="650" width="115" height="115" fill="#00a4ef"/>
    <rect x="258" y="650" width="115" height="115" fill="#7fba00"/>
    <rect x="132" y="776" width="115" height="115" fill="#ffb900"/>
    <rect x="258" y="776" width="115" height="115" fill="#f25022"/>
  </g>

  <g transform="translate(202 132) scale(1.08)" filter="url(#softGlow)">
    <use href="#alienGreen"/>
  </g>
  <g transform="translate(360 232) scale(0.86)">
    <use href="#alienBlue"/>
  </g>
  <g transform="translate(1155 136) scale(1.02)" filter="url(#softGlow)">
    <use href="#alienOrange"/>
  </g>
  <g transform="translate(1296 270) scale(0.78)">
    <use href="#alienGreen"/>
  </g>
  <g transform="translate(992 252) scale(0.72)">
    <use href="#alienBlue"/>
  </g>

  <g transform="translate(650 94)">
    <rect x="0" y="0" width="300" height="94" rx="8" fill="#0f172a" stroke="#73e6ff" stroke-width="3" opacity="0.95"/>
    <rect x="24" y="24" width="54" height="18" fill="#00a4ef"/>
    <rect x="88" y="24" width="72" height="18" fill="#7fba00"/>
    <rect x="170" y="24" width="38" height="18" fill="#ffb900"/>
    <rect x="218" y="24" width="58" height="18" fill="#f25022"/>
    <rect x="24" y="56" width="92" height="14" fill="#d7f7ff" opacity="0.9"/>
    <rect x="130" y="56" width="146" height="14" fill="#73e6ff" opacity="0.72"/>
  </g>

  <g transform="translate(1110 520) rotate(-9)">
    <path d="M0 84 L94 0 L188 84 L146 96 L124 76 L64 76 L42 96 Z" fill="#e5f7ff" stroke="#73e6ff" stroke-width="5"/>
    <rect x="72" y="48" width="44" height="22" rx="6" fill="#00a4ef"/>
    <path d="M58 100 L40 146 L76 116 Z" fill="#ffb900"/>
    <path d="M130 100 L112 116 L148 146 Z" fill="#f25022"/>
  </g>

  <g transform="translate(272 505) rotate(8)">
    <path d="M0 80 L72 12 L144 80 L110 92 L92 75 L52 75 L34 92 Z" fill="#dfffd4" stroke="#7fba00" stroke-width="5"/>
    <rect x="54" y="48" width="36" height="18" rx="5" fill="#7fba00"/>
    <path d="M48 96 L30 136 L64 110 Z" fill="#00a4ef"/>
    <path d="M98 96 L80 110 L114 136 Z" fill="#ffb900"/>
  </g>

  <g transform="translate(531 255)">
    <rect x="0" y="0" width="540" height="332" rx="10" fill="#f8fbff" opacity="0.98"/>
    <rect x="0" y="0" width="540" height="50" rx="10" fill="#24292f"/>
    <circle cx="28" cy="25" r="7" fill="#f25022"/>
    <circle cx="52" cy="25" r="7" fill="#ffb900"/>
    <circle cx="76" cy="25" r="7" fill="#7fba00"/>
    <text x="112" y="32" fill="#d7f7ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Game makers community</text>
    <text x="35" y="104" fill="#0969da" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700">&lt;Build /&gt;</text>
    <text x="35" y="152" fill="#24292f" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">SPACE INVADERS</text>
    <text x="35" y="202" fill="#57606a" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">create • remix • ship</text>
    <rect x="35" y="240" width="112" height="36" rx="6" fill="#00a4ef"/>
    <rect x="161" y="240" width="112" height="36" rx="6" fill="#7fba00"/>
    <rect x="287" y="240" width="112" height="36" rx="6" fill="#ffb900"/>
    <rect x="413" y="240" width="92" height="36" rx="6" fill="#f25022"/>
  </g>

  <g transform="translate(640 612)">
    <rect x="0" y="0" width="320" height="126" rx="14" fill="#24292f" stroke="#ffffff" stroke-width="5"/>
    <path d="M70 76 C40 76 26 58 26 40 C26 22 42 10 62 10 C80 10 91 18 98 30 C108 18 124 10 144 10 L176 10 C196 10 212 18 222 30 C229 18 240 10 258 10 C278 10 294 22 294 40 C294 58 280 76 250 76 L226 76 L226 98 L196 98 L196 76 L124 76 L124 98 L94 98 L94 76 Z" fill="#ffffff"/>
    <rect x="65" y="38" width="48" height="22" rx="11" fill="#24292f"/>
    <rect x="207" y="38" width="48" height="22" rx="11" fill="#24292f"/>
    <circle cx="82" cy="49" r="5" fill="#73e6ff"/>
    <circle cx="224" cy="49" r="5" fill="#73e6ff"/>
    <text x="160" y="117" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">GitHub Copilot</text>
  </g>

  <g stroke="#73e6ff" stroke-width="5" stroke-linecap="square" opacity="0.86">
    <line x1="667" y1="600" x2="667" y2="560"/>
    <line x1="735" y1="612" x2="735" y2="548"/>
    <line x1="866" y1="610" x2="866" y2="556"/>
    <line x1="926" y1="600" x2="926" y2="570"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="800" y="804" fill="#ffffff" font-size="44">Microsoft Build 2026</text>
    <text x="800" y="852" fill="#9be7ff" font-size="30">Space Invaders Game Makers Community</text>
  </g>
</svg>
